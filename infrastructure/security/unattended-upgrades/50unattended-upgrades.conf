# unattended-upgrades untuk Ubuntu — drop ke /etc/apt/apt.conf.d/50unattended-upgrades
# Aktifkan origin paket yang di-update otomatis (baris tanpa komentar):
Unattended-Upgrade::Allowed-Origins {
    "${distro_id}:${distro_codename}";
    "${distro_id}:${distro_codename}-security";
    "${distro_id}ESMApps:${distro_codename}-apps-security";
    "${distro_id}ESM:${distro_codename}-infra-security";
};

# Jangan auto-reboot (untuk production — reboot manual via maintenance window)
Unattended-Upgrade::Automatic-Reboot "false";

# Email notifikasi butuh MTA terinstall (postfix/etc); kosongkan untuk menonaktifkan
Unattended-Upgrade::Mail "spesialis.onovoda@gmail.com";
Unattended-Upgrade::MailOnlyOnError "false";

# Nonaktifkan upgarde kernel otomatis — kernel dipasang manual saat maintenance
Unattended-Upgrade::Package-Blacklist {
    "linux-image-.*";
    "linux-headers-.*";
};

# Jalan tiap hari jam 06:30 WIB (03:30 UTC) — override timer default
Unattended-Upgrade::Update-Package-Lists "true";
Unattended-Upgrade::Download-Upgradeable-Packages "true";
Unattended-Upgrade::Automatic-Reboot-WithUsers "false";
Unattended-Upgrade::Remove-Unused-Kernel-Packages "false";
Unattended-Upgrade::Remove-New-Unused-Dependencies "true";
