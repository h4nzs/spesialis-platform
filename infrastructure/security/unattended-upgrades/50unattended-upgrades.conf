# unattended-upgrades untuk **Debian 13 (trixie)** — drop ke /etc/apt/apt.conf.d/50unattended-upgrades
# (jangan pakai origin Ubuntu/ESM — itu hanya untuk Ubuntu)
Unattended-Upgrade::Allowed-Origins {
    "${distro_id}:${distro_codename}";
    "${distro_id}:${distro_codename}-updates";
    "${distro_id}:${distro_codename}-security";
};

# Jangan auto-reboot (production — reboot manual via maintenance window)
Unattended-Upgrade::Automatic-Reboot "false";

# Email notifikasi butuh MTA (postfix) — kosongkan jika tidak ada MTA
Unattended-Upgrade::Mail "spesialis.onovoda@gmail.com";
Unattended-Upgrade::MailOnlyOnError "false";

# Nonaktifkan upgrade kernel otomatis — kernel dipasang manual saat maintenance
Unattended-Upgrade::Package-Blacklist {
    "linux-image-.*";
    "linux-headers-.*";
};

Unattended-Upgrade::Remove-New-Unused-Dependencies "true";
