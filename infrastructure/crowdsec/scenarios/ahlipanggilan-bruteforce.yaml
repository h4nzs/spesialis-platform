type: leaky
name: ahlipanggilan/bruteforce-login
description: 'Brute force pada endpoint auth Ahli Panggilan (401 pada /api/auth/*)'
filter: |
  evt.Parsed.verb == 'POST'
  && evt.Parsed.http_path startsWith '/api/v1/auth/'
  && evt.Parsed.http_status == '401'
leakspeed: 60s
capacity: 5
groupby: evt.Parsed.source_ip
reprocess: true
labels:
  type: bruteforce
  service: ahlipanggilan
  behavior: 'http:bruteforce'
  severity: critical

decisions:
  - type: ban
    duration: 10m
