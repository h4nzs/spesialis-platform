# CrowdSec engine (container) + firewall bouncer (paket host — tidak ada
# image resmi; lihat RUNBOOK Part 5.3).
#
# Prasyarat:
#   1. Named volume log nginx harus ada — dibuat otomatis oleh docker-compose.prod.yml
#      saat deploy berikutnya (prefix project = nama direktori repo, mis. spesialis-platform):
#        docker volume ls | grep nginx-logs
#      Sesuaikan name: pada volumes di bawah dengan hasil grep bila berbeda.
#   2. Start engine:
#        export BOUNCER_API_KEY=dummy && docker compose -f docker-compose.crowdsec.yml up -d crowdsec
#   3. Generate key untuk bouncer host:
#        docker compose -f docker-compose.crowdsec.yml exec crowdsec cscli bouncers add ap-bouncer
#   4. Verifikasi:
#        docker compose -f docker-compose.crowdsec.yml exec crowdsec cscli decisions list
#        docker compose -f docker-compose.crowdsec.yml logs -f crowdsec
#
# Alert diteruskan ke alert gateway API (email + Discord) via webhook —
# lihat notifications/alert-gateway.yaml.

services:
  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: crowdsec
    restart: unless-stopped
    environment:
      COLLECTIONS: 'crowdsecurity/nginx crowdsecurity/linux'
      LOG_LEVEL: info
      GID: '0'
      UID: '0'
    ports:
      # Hanya localhost — firewall-bouncer host (paket apt) butuh LAPI
      - '127.0.0.1:8080:8080'
    volumes:
      - ./config:/etc/crowdsec/acquis.d:ro
      - ./scenarios:/etc/crowdsec/scenarios/custom:ro
      - crowdsec-db:/var/lib/crowdsec/data
      - crowdsec-config:/etc/crowdsec
      # Log nginx dibaca langsung dari named volume milik stack utama
      - spesialis-platform_nginx-logs:/var/log/nginx:ro
      # NOTIFIKASI: jangan di-mount — file disalin manual ke
      # /etc/crowdsec/notifications/ (volume crowdsec-config) + sed secret,
      # lalu di-attach via /etc/crowdsec/profiles.yaml (lihat RUNBOOK)

volumes:
  crowdsec-db:
  crowdsec-config:
  spesialis-platform_nginx-logs:
    external: true
